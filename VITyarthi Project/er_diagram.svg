<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="460" fill="#ffffff"/>
  <text x="350" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2430">ER / Storage Diagram — employees.json</text>
  <text x="350" y="54" text-anchor="middle" font-size="12" fill="#5b6660">Single entity, stored as a JSON object of parallel lists (one list per field)</text>

  <!-- Entity box -->
  <rect x="220" y="90" width="260" height="40" fill="#2f6f4e" stroke="#1b2430" stroke-width="1.5"/>
  <text x="350" y="115" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">Employee</text>

  <rect x="220" y="130" width="260" height="250" fill="#eef1ec" stroke="#1b2430" stroke-width="1.5"/>

  <g font-family="'IBM Plex Mono', monospace" font-size="12.5" fill="#1b2430">
    <line x1="220" y1="170" x2="480" y2="170" stroke="#c9d0c6"/>
    <text x="235" y="160" font-weight="bold">Id</text>
    <text x="465" y="160" text-anchor="end" fill="#5b6660">PK · string</text>

    <line x1="220" y1="210" x2="480" y2="210" stroke="#c9d0c6"/>
    <text x="235" y="200">Name</text>
    <text x="465" y="200" text-anchor="end" fill="#5b6660">string</text>

    <line x1="220" y1="250" x2="480" y2="250" stroke="#c9d0c6"/>
    <text x="235" y="240">Department</text>
    <text x="465" y="240" text-anchor="end" fill="#5b6660">string</text>

    <line x1="220" y1="290" x2="480" y2="290" stroke="#c9d0c6"/>
    <text x="235" y="280">Salary</text>
    <text x="465" y="280" text-anchor="end" fill="#5b6660">number</text>

    <line x1="220" y1="330" x2="480" y2="330" stroke="#c9d0c6"/>
    <text x="235" y="320">Password</text>
    <text x="465" y="320" text-anchor="end" fill="#5b6660">string</text>

    <text x="235" y="360">(all lists share index i</text>
    <text x="235" y="374">= one employee's record)</text>
  </g>

  <text x="350" y="420" text-anchor="middle" font-size="11.5" fill="#5b6660">Id is generated from Name + Department + a running count (e.g. "SAMsal1"), not auto-incremented by the database.</text>
</svg>
