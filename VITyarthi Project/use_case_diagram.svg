<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2430">Use Case Diagram — Employee Salary Management System</text>

  <!-- System boundary -->
  <rect x="220" y="60" width="480" height="520" fill="#f4f6f5" stroke="#2f6f4e" stroke-width="2" rx="8"/>
  <text x="460" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6f4e">Employee Salary Management System</text>

  <!-- Employee actor -->
  <g transform="translate(60,300)">
    <circle cx="0" cy="-40" r="14" fill="none" stroke="#1b2430" stroke-width="2"/>
    <line x1="0" y1="-26" x2="0" y2="20" stroke="#1b2430" stroke-width="2"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#1b2430" stroke-width="2"/>
    <line x1="0" y1="20" x2="-16" y2="55" stroke="#1b2430" stroke-width="2"/>
    <line x1="0" y1="20" x2="16" y2="55" stroke="#1b2430" stroke-width="2"/>
    <text x="0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2430">Employee</text>
  </g>

  <!-- Admin actor -->
  <g transform="translate(840,300)">
    <circle cx="0" cy="-40" r="14" fill="none" stroke="#1b2430" stroke-width="2"/>
    <line x1="0" y1="-26" x2="0" y2="20" stroke="#1b2430" stroke-width="2"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#1b2430" stroke-width="2"/>
    <line x1="0" y1="20" x2="-16" y2="55" stroke="#1b2430" stroke-width="2"/>
    <line x1="0" y1="20" x2="16" y2="55" stroke="#1b2430" stroke-width="2"/>
    <text x="0" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2430">Admin</text>
  </g>

  <!-- Use case ovals -->
  <g font-size="12" fill="#1b2430">
    <ellipse cx="340" cy="120" rx="90" ry="26" fill="#ffffff" stroke="#1b2430"/>
    <text x="340" y="124" text-anchor="middle">Register</text>

    <ellipse cx="340" cy="190" rx="90" ry="26" fill="#ffffff" stroke="#1b2430"/>
    <text x="340" y="194" text-anchor="middle">Login</text>

    <ellipse cx="340" cy="260" rx="105" ry="30" fill="#ffffff" stroke="#1b2430"/>
    <text x="340" y="256" text-anchor="middle">View Own</text>
    <text x="340" y="270" text-anchor="middle">Details</text>

    <ellipse cx="340" cy="335" rx="105" ry="30" fill="#ffffff" stroke="#1b2430"/>
    <text x="340" y="331" text-anchor="middle">Update Own</text>
    <text x="340" y="345" text-anchor="middle">Details</text>

    <ellipse cx="340" cy="410" rx="105" ry="30" fill="#ffffff" stroke="#1b2430"/>
    <text x="340" y="406" text-anchor="middle">Delete Own</text>
    <text x="340" y="420" text-anchor="middle">Account</text>

    <ellipse cx="580" cy="480" rx="110" ry="26" fill="#eef1ec" stroke="#1b2430"/>
    <text x="580" y="484" text-anchor="middle">View All Employees</text>

    <ellipse cx="580" cy="540" rx="110" ry="30" fill="#eef1ec" stroke="#1b2430"/>
    <text x="580" y="536" text-anchor="middle">Update Any Employee</text>
    <text x="580" y="550" text-anchor="middle">(incl. Salary)</text>

    <ellipse cx="580" cy="140" rx="110" ry="26" fill="#eef1ec" stroke="#1b2430"/>
    <text x="580" y="144" text-anchor="middle">Delete Any Employee</text>

    <ellipse cx="580" cy="210" rx="110" ry="26" fill="#eef1ec" stroke="#1b2430"/>
    <text x="580" y="214" text-anchor="middle">View Payroll Reports</text>
  </g>

  <!-- Employee connections -->
  <g stroke="#1b2430" stroke-width="1.3">
    <line x1="90" y1="320" x2="250" y2="120"/>
    <line x1="90" y1="320" x2="250" y2="190"/>
    <line x1="90" y1="320" x2="235" y2="260"/>
    <line x1="90" y1="320" x2="235" y2="335"/>
    <line x1="90" y1="320" x2="235" y2="410"/>
  </g>

  <!-- Admin connections -->
  <g stroke="#2f6f4e" stroke-width="1.3">
    <line x1="810" y1="320" x2="430" y2="190"/>
    <line x1="810" y1="320" x2="470" y2="480"/>
    <line x1="810" y1="320" x2="470" y2="540"/>
    <line x1="810" y1="320" x2="470" y2="140"/>
    <line x1="810" y1="320" x2="470" y2="210"/>
  </g>

  <text x="450" y="605" text-anchor="middle" font-size="11" fill="#5b6660">Black lines = Employee actions · Green lines = Admin actions · Login is shared by both roles</text>
</svg>
