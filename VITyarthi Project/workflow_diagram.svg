<svg viewBox="0 0 820 1180" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b2430"/>
    </marker>
  </defs>
  <rect width="820" height="1180" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2430">Program Workflow</text>

  <!-- Start -->
  <ellipse cx="410" cy="70" rx="70" ry="24" fill="#2f6f4e"/>
  <text x="410" y="75" text-anchor="middle" fill="#ffffff" font-weight="bold">Start</text>
  <line x1="410" y1="94" x2="410" y2="120" stroke="#1b2430" marker-end="url(#arrow)"/>

  <!-- Load data -->
  <rect x="320" y="120" width="180" height="45" rx="6" fill="#eef1ec" stroke="#1b2430"/>
  <text x="410" y="147" text-anchor="middle">Load employees.json</text>
  <line x1="410" y1="165" x2="410" y2="195" stroke="#1b2430" marker-end="url(#arrow)"/>

  <!-- Main menu decision -->
  <polygon points="410,195 500,240 410,285 320,240" fill="#ffffff" stroke="#1b2430"/>
  <text x="410" y="236" text-anchor="middle">Main Menu:</text>
  <text x="410" y="252" text-anchor="middle">Register / Login / Exit</text>

  <!-- Register branch -->
  <line x1="320" y1="240" x2="140" y2="240" stroke="#1b2430" marker-end="url(#arrow)"/>
  <text x="230" y="230" text-anchor="middle" fill="#5b6660">Register</text>
  <rect x="40" y="240" width="200" height="45" rx="6" fill="#eef1ec" stroke="#1b2430"/>
  <text x="140" y="267" text-anchor="middle">Collect name, dept,</text>
  <text x="140" y="281" text-anchor="middle" dy="10">password → save</text>
  <path d="M140,320 C140,380 410,380 410,285" stroke="#1b2430" fill="none" marker-end="url(#arrow)"/>

  <!-- Login branch -->
  <line x1="410" y1="285" x2="410" y2="330" stroke="#1b2430" marker-end="url(#arrow)"/>
  <text x="450" y="310" fill="#5b6660">Login</text>
  <polygon points="410,330 500,375 410,420 320,375" fill="#ffffff" stroke="#1b2430"/>
  <text x="410" y="371" text-anchor="middle">Credentials</text>
  <text x="410" y="387" text-anchor="middle">valid?</text>

  <!-- No path -->
  <line x1="320" y1="375" x2="180" y2="375" stroke="#1b2430" marker-end="url(#arrow)"/>
  <text x="250" y="365" fill="#5b6660">No</text>
  <rect x="60" y="352" width="120" height="45" rx="6" fill="#f4e4e0" stroke="#a6433a"/>
  <text x="120" y="380" text-anchor="middle">Show error,</text>
  <text x="120" y="394" text-anchor="middle">retry</text>
  <path d="M120,397 C120,440 320,440 320,395" stroke="#1b2430" fill="none" marker-end="url(#arrow)"/>

  <!-- Yes path -->
  <line x1="410" y1="420" x2="410" y2="450" stroke="#1b2430" marker-end="url(#arrow)"/>
  <text x="440" y="440" fill="#5b6660">Yes</text>

  <rect x="290" y="450" width="240" height="45" rx="6" fill="#eef1ec" stroke="#1b2430"/>
  <text x="410" y="477" text-anchor="middle">Role menu (based on user)</text>
  <line x1="410" y1="495" x2="410" y2="525" stroke="#1b2430" marker-end="url(#arrow)"/>

  <!-- Action options -->
  <g>
    <rect x="60" y="525" width="150" height="45" rx="6" fill="#ffffff" stroke="#1b2430"/>
    <text x="135" y="552" text-anchor="middle">List / View</text>

    <rect x="240" y="525" width="150" height="45" rx="6" fill="#ffffff" stroke="#1b2430"/>
    <text x="315" y="552" text-anchor="middle">Update record</text>

    <rect x="420" y="525" width="150" height="45" rx="6" fill="#ffffff" stroke="#1b2430"/>
    <text x="495" y="552" text-anchor="middle">Delete record</text>

    <rect x="600" y="525" width="150" height="45" rx="6" fill="#e9eef7" stroke="#1b2430"/>
    <text x="675" y="546" text-anchor="middle">View reports</text>
    <text x="675" y="560" text-anchor="middle" font-size="10.5" fill="#5b6660">(admin only)</text>

    <line x1="410" y1="495" x2="135" y2="525" stroke="#1b2430" marker-end="url(#arrow)"/>
    <line x1="410" y1="495" x2="315" y2="525" stroke="#1b2430" marker-end="url(#arrow)"/>
    <line x1="410" y1="495" x2="495" y2="525" stroke="#1b2430" marker-end="url(#arrow)"/>
    <line x1="410" y1="495" x2="675" y2="525" stroke="#1b2430" marker-end="url(#arrow)"/>
  </g>

  <!-- Permission check -->
  <line x1="315" y1="570" x2="315" y2="600" stroke="#1b2430" marker-end="url(#arrow)"/>
  <line x1="495" y1="570" x2="495" y2="600" stroke="#1b2430" marker-end="url(#arrow)"/>
  <polygon points="405,600 495,635 405,670 315,635" fill="#ffffff" stroke="#1b2430"/>
  <text x="405" y="631" text-anchor="middle">Own record or</text>
  <text x="405" y="647" text-anchor="middle">admin?</text>

  <line x1="405" y1="670" x2="405" y2="700" stroke="#1b2430" marker-end="url(#arrow)"/>
  <text x="435" y="690" fill="#5b6660">Yes</text>
  <rect x="305" y="700" width="200" height="45" rx="6" fill="#eef1ec" stroke="#1b2430"/>
  <text x="405" y="727" text-anchor="middle">Apply change, save_data()</text>

  <line x1="315" y1="635" x2="120" y2="635" stroke="#1b2430" marker-end="url(#arrow)"/>
  <text x="200" y="625" fill="#5b6660">No</text>
  <rect x="20" y="613" width="200" height="45" rx="6" fill="#f4e4e0" stroke="#a6433a"/>
  <text x="120" y="640" text-anchor="middle">Block: "not your account"</text>

  <!-- Loop back -->
  <path d="M405,745 C405,800 700,800 700,255 C700,225 500,215 500,235" stroke="#1b2430" fill="none" marker-end="url(#arrow)"/>
  <text x="720" y="500" fill="#5b6660" writing-mode="tb">back to main menu</text>

  <!-- Exit branch -->
  <line x1="500" y1="240" x2="640" y2="240" stroke="#1b2430" marker-end="url(#arrow)"/>
  <text x="580" y="230" fill="#5b6660">Exit</text>
  <rect x="640" y="218" width="130" height="45" rx="6" fill="#eef1ec" stroke="#1b2430"/>
  <text x="705" y="245" text-anchor="middle">Print "Goodbye"</text>
  <line x1="705" y1="263" x2="705" y2="1000" stroke="#1b2430" marker-end="url(#arrow)"/>

  <ellipse cx="705" cy="1030" rx="70" ry="24" fill="#a6433a"/>
  <text x="705" y="1035" text-anchor="middle" fill="#ffffff" font-weight="bold">End</text>
</svg>
