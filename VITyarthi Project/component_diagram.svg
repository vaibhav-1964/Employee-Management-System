<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b2430"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2430">Component Diagram — Module Structure</text>

  <!-- main.py -->
  <rect x="330" y="70" width="240" height="90" rx="8" fill="#2f6f4e" stroke="#1b2430" stroke-width="1.5"/>
  <text x="450" y="98" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="14">main.py</text>
  <text x="450" y="118" text-anchor="middle" fill="#ffffff" font-size="11">Entry point</text>
  <text x="450" y="134" text-anchor="middle" fill="#ffffff" font-size="11">main() — menu loop</text>

  <!-- employee_functions.py -->
  <rect x="150" y="240" width="600" height="210" rx="8" fill="#eef1ec" stroke="#1b2430" stroke-width="1.5"/>
  <text x="450" y="265" text-anchor="middle" font-weight="bold" font-size="14" fill="#1b2430">employee_functions.py</text>

  <g font-size="11.5" fill="#1b2430">
    <rect x="175" y="280" width="160" height="30" rx="4" fill="#ffffff" stroke="#c9d0c6"/>
    <text x="255" y="300" text-anchor="middle">register_employees()</text>

    <rect x="345" y="280" width="160" height="30" rx="4" fill="#ffffff" stroke="#c9d0c6"/>
    <text x="425" y="300" text-anchor="middle">login()</text>

    <rect x="515" y="280" width="200" height="30" rx="4" fill="#ffffff" stroke="#c9d0c6"/>
    <text x="615" y="300" text-anchor="middle">list_employees() / show_employees()</text>

    <rect x="175" y="320" width="160" height="30" rx="4" fill="#ffffff" stroke="#c9d0c6"/>
    <text x="255" y="340" text-anchor="middle">find_employees()</text>

    <rect x="345" y="320" width="160" height="30" rx="4" fill="#ffffff" stroke="#c9d0c6"/>
    <text x="425" y="340" text-anchor="middle">update_employees()</text>

    <rect x="515" y="320" width="200" height="30" rx="4" fill="#ffffff" stroke="#c9d0c6"/>
    <text x="615" y="340" text-anchor="middle">delete_employees()</text>

    <rect x="175" y="360" width="160" height="30" rx="4" fill="#ffffff" stroke="#c9d0c6"/>
    <text x="255" y="380" text-anchor="middle">create_id() / net_pay()</text>

    <rect x="345" y="360" width="160" height="30" rx="4" fill="#ffffff" stroke="#c9d0c6"/>
    <text x="425" y="380" text-anchor="middle">payroll()</text>

    <rect x="515" y="360" width="200" height="30" rx="4" fill="#ffffff" stroke="#c9d0c6"/>
    <text x="615" y="380" text-anchor="middle">department_total()</text>

    <rect x="175" y="400" width="340" height="30" rx="4" fill="#ffffff" stroke="#c9d0c6"/>
    <text x="345" y="420" text-anchor="middle">save_data() / load_data()  (uses json, os)</text>
  </g>

  <!-- data.py -->
  <rect x="330" y="490" width="240" height="60" rx="8" fill="#9c7a32" stroke="#1b2430" stroke-width="1.5"/>
  <text x="450" y="513" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="14">data.py</text>
  <text x="450" y="530" text-anchor="middle" fill="#ffffff" font-size="10.5">employees dict, Salary, Bonus, admin_password</text>

  <!-- Arrows -->
  <line x1="450" y1="160" x2="450" y2="235" stroke="#1b2430" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="470" y="200" fill="#5b6660" font-size="11">calls</text>

  <line x1="450" y1="450" x2="450" y2="485" stroke="#1b2430" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="470" y="470" fill="#5b6660" font-size="11">reads/writes</text>

  <path d="M330,110 C230,110 210,300 245,300" stroke="#1b2430" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
  <text x="150" y="190" fill="#5b6660" font-size="10.5">main.py also imports</text>
  <text x="150" y="205" fill="#5b6660" font-size="10.5">"employees" directly from data.py</text>
  <path d="M330,145 C120,180 120,470 325,510" stroke="#1b2430" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
</svg>
